openapi: 3.0.3
info:
  title: NetAPI — Domain Data API
  version: 2.2.0
  description: |
    NetAPI serves daily-updated domain data as CSV: full domain lists and
    detailed datasets for more than 1,500 TLDs, newly registered domains,
    domains grouped by DNS provider or registrar, single-domain and single-IP lookups, and free threat-intelligence
    feeds.

    All API operations share one path, `GET /api2/`, and are selected with
    the `method` query parameter. The other parameters depend on the method;
    see the `method` description and the per-endpoint documentation in the
    `endpoints/` directory of this repository.

    Errors are returned as a short plain-text message whose text starts with
    the HTTP status code, e.g. `403 Forbidden: No active/paid plan.`

    `GET /api-json/` is the JSON twin of the API for integrations and AI
    tools (it also powers the NetAPI MCP server, https://mcp.netapi.com/mcp):
    JSON documents, JSON errors `{"error": {"code", "message"}}`, the token in
    the `Authorization: Bearer` header. Both share the request limits
    (429 Too Many Requests + Retry-After when a limit is reached).
  contact:
    name: NetAPI support
    url: https://netapi.com/contact-us/
  termsOfService: https://netapi.com/tos/
  license:
    name: NetAPI Terms of Service (paid data); CC BY 4.0 (free datasets)
    url: https://netapi.com/tos/
externalDocs:
  description: Web API reference
  url: https://netapi.com/help/api/

servers:
  - url: https://netapi.com
    description: Production

tags:
  - name: reference
    description: Free lists of zones, DNS providers and registrars
  - name: downloads
    description: Full CSV downloads (token + active plan)
  - name: lookups
    description: Single-domain and single-IP lookups (token + active plan)
  - name: threat-intelligence
    description: Free compromised-IP feed (NetAPI Nightwatch honeypot network, hourly) and compromised-domain feed (daily)
  - name: free-datasets
    description: Free datasets served outside /api2/
  - name: json-api
    description: The JSON API (/api-json/) for integrations and AI tools

paths:
  /api2/:
    get:
      operationId: api2
      summary: Call an API method
      description: |
        Selects the operation with `method`. Required parameters per method:

        | method | required | optional | auth |
        |---|---|---|---|
        | `zones` | — | — | none |
        | `dns` | — | — | none |
        | `registrars` | — | — | none |
        | `download` | `zone_tld`, `dataset_type`, `filter_type`, `token` | `format` | token + plan |
        | `download-dns` | `dns_alias`, `dataset_type`, `token` | `format` | token + plan |
        | `download-whois` | `registrar_id`, `dataset_type`, `token` | `format` | token + plan |
        | `lookup-domain` | `domain`, `token` | — | token + plan |
        | `lookup-ip` | `ip`, `token` | — | token + plan |
        | `compromised` | `dataset_type` (`ip`, `url`, `ip-all`, `url-all`) | `format`; IP lists also `window`, `category`, `threat`, `country`, `country_not`, `min_sensors` | none |
        | `compromised-zone` | `zone_tld` | — | none |

        `dataset_type=dataset` on any download method requires the Plus plan or higher.
      tags: [reference, downloads, lookups, threat-intelligence]
      security:
        - {}
        - apiToken: []
      parameters:
        - name: method
          in: query
          required: true
          description: API method to call.
          schema:
            type: string
            enum:
              - zones
              - dns
              - registrars
              - download
              - download-dns
              - download-whois
              - lookup-domain
              - lookup-ip
              - compromised
              - compromised-zone
        - name: token
          in: query
          required: false
          description: |
            API token from https://netapi.com/dashboard/. Required by `download*`
            and `lookup-*` methods; ignored by the free methods.
          schema:
            type: string
        - name: zone_tld
          in: query
          required: false
          description: |
            First-level TLD without the leading dot (`com`, `net`, `uk`; punycode for
            IDN zones such as `xn--p1ai`). `download` also accepts `all-zones`.
            Valid values come from `method=zones`.
          schema:
            type: string
          example: net
        - name: dataset_type
          in: query
          required: false
          description: |
            For `download`, `download-dns`, `download-whois`: `list` (one domain per line) or `dataset` (domain
            plus metadata).

            For `compromised`: `ip` (IP addresses that attacked NetAPI Nightwatch, NetAPI's honeypot network,
            in the last 24 hours, rebuilt hourly), `ip-all` (all IPs ever listed), `url` (current domains),
            `url-all` (all domains ever listed).
          schema:
            type: string
            enum: [list, dataset, url, ip, url-all, ip-all]
        - name: filter_type
          in: query
          required: false
          description: |
            `download` only. `active` — all registered domains; `new` — domains
            first seen in the last 24 hours. `new` exists only for zones with
            `isUpdatedDaily=1` (fully refreshed daily).
          schema:
            type: string
            enum: [active, new]
        - name: dns_alias
          in: query
          required: false
          description: "`download-dns` only. Provider alias from `method=dns`, e.g. `cloudflare`."
          schema:
            type: string
          example: cloudflare
        - name: registrar_id
          in: query
          required: false
          description: "`download-whois` only. Numeric registrar ID from `method=registrars`, e.g. `146` for GoDaddy.com, LLC."
          schema:
            type: integer
          example: 146
        - name: domain
          in: query
          required: false
          description: "`lookup-domain` only. Registered domain name, e.g. `example.com`. Maximum 199 characters."
          schema:
            type: string
            maxLength: 199
          example: example.com
        - name: ip
          in: query
          required: false
          description: "`lookup-ip` only. IPv4 or IPv6 address. Maximum 99 characters."
          schema:
            type: string
            maxLength: 99
          example: 172.67.69.160
        - name: format
          in: query
          required: false
          description: |
            Download methods: `plain` returns uncompressed CSV instead of `.csv.gz`. Plain files for large zones are several gigabytes.

            `compromised` with `dataset_type=url|url-all`: `hosts` returns `0.0.0.0 domain` lines for hosts-based blockers.

            `compromised` with `dataset_type=ip|ip-all`: `plain` (default, one IP per line), `csv` / `jsonl` (one row or JSON
            object per address with threat data: `ip`, `first_seen`, `last_seen`, `category`, `top_threat`, `threats`,
            `country`, `asn`, `as_name`, `sensors`), `ipset`, `nftables`, `iptables`, `mikrotik` (ready-to-load firewall
            files) or `cidr` (addresses collapsed into CIDR blocks). Any other value returns the plain list.
          schema:
            type: string
            enum: [plain, hosts, csv, jsonl, ipset, nftables, iptables, mikrotik, cidr]
        - name: window
          in: query
          required: false
          description: "`compromised`: with `dataset_type=ip-all` `24h`, `48h`, `7d` or `30d`, addresses that attacked within that time; `dataset_type=ip` is the 48-hour list, `24h` narrows it."
          schema:
            type: string
            enum: [24h, 48h, 7d, 30d]
        - name: category
          in: query
          required: false
          description: "`compromised` IP lists: `A` malware (infection attempts and the servers they download from), `B` password guessing, `C` exploits, `D` form spam, several separated by commas."
          schema:
            type: string
          example: B,C
        - name: threat
          in: query
          required: false
          description: "`compromised` IP lists: attack types, separated by commas (e.g. `ssh-bruteforce,rdp-bruteforce`). An address matches when it did one of them within the window."
          schema:
            type: string
          example: ssh-bruteforce
        - name: country
          in: query
          required: false
          description: "`compromised` IP lists: two-letter country codes of the addresses to keep, separated by commas. Not together with `country_not`."
          schema:
            type: string
          example: cn,ru
        - name: country_not
          in: query
          required: false
          description: "`compromised` IP lists: two-letter country codes of the addresses to leave out, separated by commas."
          schema:
            type: string
        - name: min_sensors
          in: query
          required: false
          description: "`compromised` IP lists: only addresses seen by at least this many NetAPI Nightwatch sensors."
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: |
            Success. The body depends on the method:

            * `zones`, `dns`, `registrars` — CSV with a header row (`text/html; charset=UTF-8` is sent as content type; treat the body as CSV).
            * `download*` — CSV file, gzip-compressed unless `format=plain`, served with a `Content-Disposition` filename.
            * `lookup-domain` — one CSV row without header (`url,dns1,dns2,hostname,ip,ip_country,registered_at,expiring_at,registrar_id,whois_checked_at,compromised`), or the text `NOT FOUND`.
            * `lookup-ip` — up to 3 CSV rows without header (`url,hostname,dns1,dns2`), or the text `NOT FOUND`.
            * `compromised`, `compromised-zone` — one `#` comment line followed by one domain or IP per line. The IP lists also come as CSV / JSON Lines with threat data and as firewall files (see `format`).
          content:
            text/csv:
              schema:
                type: string
              examples:
                zones:
                  summary: method=zones
                  value: |
                    zoneTLD,isUpdatedDaily,isCountryCode
                    com,1,0
                    de,0,1
                dns:
                  summary: method=dns
                  value: |
                    alias,title,total
                    cloudflare,"Cloudflare",38002618
                registrars:
                  summary: method=registrars
                  value: |
                    id,name,brand_name,total
                    146,"GoDaddy.com, LLC","GoDaddy",65992964
                zoneDataset:
                  summary: download, dataset_type=dataset
                  value: |
                    url,majestic_rank,dns1,dns2,hostname,emails,phones,ip,ip_country,registered_at,expiring_at,registrar,whois_checked_at
                    example.net,8421,ns1.example.net,ns2.example.net,web1.example.net,"info@example.net,sales@example.net",+1-202-555-0143,203.0.113.10,US,2015-08-14,2027-08-13,"GoDaddy.com, LLC",2026-09-30
                registrarDataset:
                  summary: download-whois, dataset_type=dataset
                  value: |
                    registrar,url,registered_at,expiring_at,majestic_rank,emails,phones,ip,ip_country
                    "GoDaddy.com, LLC",themis.abogado,2025-03-12,2027-03-12,,info@themis.abogado,,34.174.62.87,US
                lookupDomain:
                  summary: lookup-domain
                  value: |
                    example.com,ns1.example.com,ns2.example.com,web1.example.com,203.0.113.10,US,2015-08-14,2027-08-13,146,2026-09-30
                lookupIp:
                  summary: lookup-ip
                  value: |
                    example.com,web1.example.com,ns1.example.com,ns2.example.com
                compromised:
                  summary: compromised, dataset_type=url
                  value: |
                    # NetAPI.com - currently compromised URLs (2026-11-01).
                    000359.xyz
                    00zyku.com
                compromisedIp:
                  summary: compromised, dataset_type=ip
                  value: |
                    # NetAPI.com - currently compromised IPs (2026-11-01).
                    1.10.132.54
                    1.10.214.100
                compromisedIpCsv:
                  summary: compromised, dataset_type=ip, format=csv
                  value: |
                    ip,first_seen,last_seen,category,top_threat,threats,country,asn,as_name,sensors
                    1.10.132.54,2026-11-01T05:11:30Z,2026-11-01T05:14:18Z,C,ms17-010-exploit,ms17-010-exploit,TH,23969,"TOT-NET - TOT Public Company Limited",1
            application/octet-stream:
              schema:
                type: string
                format: binary
              examples:
                gzip:
                  summary: download*, default gzip response
                  description: A `.csv.gz` file with the CSV shown in the text/csv examples.
        '401':
          description: "`401 Unauthorized: Missing user token.`"
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: |
            One of:
            * `403 Forbidden: Incorrect token.`
            * `403 Forbidden: No active/paid plan.`
            * `403 Forbidden: Your current plan does not allow downloading of detailed datasets.`
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: "`404 Not Found: File not found. Please contact the server administrator.` — the requested file does not exist (e.g. `new` for a zone with `isUpdatedDaily=0`)."
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: |
            Missing or invalid `method` or parameter, e.g.
            `405 Method Not Allowed: Missing API method.`,
            `405 Method Not Allowed: Unsupported method (x).`,
            `405 Method Not Allowed: Invalid zone tld.`,
            `405 Method Not Allowed: Missing dataset type.`,
            `405 Method Not Allowed: Invalid category: use A, B, C or D, separated by commas.`
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: "`503 Service Unavailable: The list is being rebuilt, try again in a few minutes.` (compromised IP lists with threat data, rare)"
          content:
            text/plain:
              schema:
                type: string

  /api-json/:
    get:
      operationId: apiJson
      summary: Call a JSON API method
      description: |
        Selects the operation with `method`. Required parameters per method:

        | method | required | optional | auth |
        |---|---|---|---|
        | `compromised-check` | `value` | — | none |
        | `search-new` | `q` (4+ characters) | `days` (1-7), `tld`, `match`, `limit` | none |
        | `tld-stats` | `tld` | — | none |
        | `domain-rank` | `domain` | — | none |
        | `top-websites` | `country` | `limit`, `offset` (offset + limit <= 1000) | none |
        | `top-1m` | — | `limit`, `offset` | none |
        | `registrar-info` | `q` (name, brand or id) | — | none |
        | `dns-provider-info` | `q` (alias, name or nameserver root) | — | none |
        | `zones` | — | `min_domains`, `cctld` | none |
        | `me` | — | — | token |
        | `lookup-domain` | `domain` | — | token + plan |
        | `lookup-ip` | `ip` | — | token + plan |
        | `download-url` | `zone_tld`, `dataset_type`, `filter_type` | `format` | token + plan (datasets: Plus+) |

        A token (Bearer header or `token`) raises the limits of the free methods. `source` tags the caller
        (`mcp`, `gpt`) in the usage log.
      tags: [json-api]
      security:
        - {}
        - bearerToken: []
        - apiToken: []
      parameters:
        - name: method
          in: query
          required: true
          schema:
            type: string
            enum:
              - compromised-check
              - search-new
              - tld-stats
              - domain-rank
              - top-websites
              - top-1m
              - registrar-info
              - dns-provider-info
              - zones
              - me
              - lookup-domain
              - lookup-ip
              - download-url
        - name: value
          in: query
          required: false
          description: Domain name, hostname, URL or IP address for `compromised-check`.
          schema:
            type: string
          example: example.com
        - name: q
          in: query
          required: false
          description: Search text for `search-new` (letters, digits, dots, hyphens; 4+ characters); name, brand, id or alias for `registrar-info` / `dns-provider-info`.
          schema:
            type: string
        - name: tld
          in: query
          required: false
          description: TLD without the dot (punycode for IDN zones), for `tld-stats` and as a filter of `search-new`.
          schema:
            type: string
          example: de
        - name: domain
          in: query
          required: false
          schema:
            type: string
          example: example.com
        - name: ip
          in: query
          required: false
          schema:
            type: string
          example: 172.67.69.160
        - name: days
          in: query
          required: false
          description: "`search-new`: how many days back, 1-7 (default 1)."
          schema:
            type: integer
            minimum: 1
            maximum: 7
        - name: match
          in: query
          required: false
          description: "`search-new`: `contains` (default) or `starts`."
          schema:
            type: string
            enum: [contains, starts]
        - name: limit
          in: query
          required: false
          description: Rows per answer; the cap depends on the access level (100 without a token).
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: min_domains
          in: query
          required: false
          description: "`zones`: only zones with at least this many active domains."
          schema:
            type: integer
        - name: cctld
          in: query
          required: false
          description: "`zones`: 1 = country-code zones only, 0 = generic zones only."
          schema:
            type: integer
            enum: [0, 1]
        - name: zone_tld
          in: query
          required: false
          description: "`download-url`: TLD or `all-zones` (or pass `dns_alias` / `registrar_id` instead)."
          schema:
            type: string
        - name: dataset_type
          in: query
          required: false
          description: "`download-url`: `list` or `dataset`."
          schema:
            type: string
            enum: [list, dataset]
        - name: filter_type
          in: query
          required: false
          description: "`download-url`, zones only: `active` (default), `new` or `deleted` (lists only)."
          schema:
            type: string
            enum: [active, new, deleted]
        - name: format
          in: query
          required: false
          description: "`download-url`: `gz` (default) or `plain`."
          schema:
            type: string
            enum: [gz, plain]
        - name: dns_alias
          in: query
          required: false
          description: "`download-url`: all domains using this DNS provider (alias from `dns-provider-info`), instead of `zone_tld`."
          schema:
            type: string
        - name: registrar_id
          in: query
          required: false
          description: "`download-url`: all domains of this registrar (id from `registrar-info`), instead of `zone_tld`."
          schema:
            type: integer
        - name: country
          in: query
          required: false
          description: "`top-websites`: country name or two-letter code (e.g. Germany, DE): the 1,000 websites users in that country visit most, on any zone, with the global rank."
          schema:
            type: string
        - name: token
          in: query
          required: false
          description: "API token as a query parameter (the `Authorization: Bearer` header is preferred)."
          schema:
            type: string
        - name: source
          in: query
          required: false
          description: Caller tag for the usage log (`mcp`, `gpt`, `web`).
          schema:
            type: string
      responses:
        '200':
          description: JSON document; the fields depend on the method (see the web reference).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Missing or invalid parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonError'
        '401':
          description: Token required, or an OAuth access token that expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonError'
        '403':
          description: Incorrect token, no active plan, or a plan too low for datasets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonError'
        '404':
          description: Unknown method, zone, registrar or provider; file not available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonError'
        '429':
          description: Request limit reached; `retry_after` (seconds) and the `Retry-After` header say when to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonError'

  /netapi_top1mln.csv:
    get:
      operationId: top1m
      tags: [free-datasets]
      summary: NetAPI Top 1 Million — free daily ranking of the most popular domains
      description: |
        Plain CSV with a header row and 1,000,000 data rows
        (`NetAPI_Rank,Domain`), rebuilt daily, about 22 MB. Licensed under
        CC BY 4.0. Methodology: https://netapi.com/top-1-mln-websites/
      externalDocs:
        url: https://netapi.com/top-1-mln-websites/
      security: []
      parameters:
        - name: token
          in: query
          required: false
          description: Optional API token; associates the download with your account in the request log. Does not change the response.
          schema:
            type: string
      responses:
        '200':
          description: The ranking.
          content:
            text/csv:
              schema:
                type: string
              example: |
                NetAPI_Rank,Domain
                1,google.com
                2,microsoft.com
                3,apple.com

components:
  schemas:
    JsonError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: rate_limited
            message:
              type: string
            retry_after:
              type: integer
              description: Seconds until the limit resets (429 only).
          additionalProperties: true
  securitySchemes:
    apiToken:
      type: apiKey
      in: query
      name: token
      description: API token from https://netapi.com/dashboard/
    bearerToken:
      type: http
      scheme: bearer
      description: The same API token in the Authorization header (JSON API); OAuth access tokens issued by https://netapi.com are accepted too.
